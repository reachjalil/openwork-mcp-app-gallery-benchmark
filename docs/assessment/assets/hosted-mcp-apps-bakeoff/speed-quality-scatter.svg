<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Speed and quality pulled in opposite directions</title>
  <desc id="desc">Scatter plot of focused work minutes against official quality score. Grok used 62.47 focused minutes and scored 68.13 officially, with a dashed counterfactual at 85.63 if merged. Sol used 131.02 minutes and scored 84.38. Fable used 140 minutes and scored 93.13. Bubble area represents total automated plus browser tests.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B16"/>
      <stop offset="1" stop-color="#101A30"/>
    </linearGradient>
    <radialGradient id="fable" cx="35%" cy="30%">
      <stop offset="0" stop-color="#FFE8A4"/>
      <stop offset="1" stop-color="#EAAE39"/>
    </radialGradient>
    <radialGradient id="sol" cx="35%" cy="30%">
      <stop offset="0" stop-color="#A6EBFF"/>
      <stop offset="1" stop-color="#2AA6DD"/>
    </radialGradient>
    <radialGradient id="grok" cx="35%" cy="30%">
      <stop offset="0" stop-color="#FFADA4"/>
      <stop offset="1" stop-color="#D44757"/>
    </radialGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#FF8277"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1480" cy="40" r="350" fill="#4C66FF" opacity="0.07"/>
  <text x="100" y="105" fill="#91A4C9" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="26" font-weight="700" letter-spacing="4">SPEED × QUALITY × TEST DEPTH</text>
  <text x="100" y="174" fill="#F7F9FF" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="56" font-weight="800">Speed and quality pulled in opposite directions.</text>
  <text x="100" y="219" fill="#AAB7D3" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24">Lower focused minutes means faster. Bubble area represents the final automated + browser test suite.</text>

  <rect x="180" y="265" width="1240" height="470" fill="#0B1223" stroke="#2A3650" stroke-width="2"/>

  <g stroke="#26324A" stroke-width="1">
    <line x1="180" y1="735" x2="1420" y2="735"/>
    <line x1="180" y1="617.5" x2="1420" y2="617.5"/>
    <line x1="180" y1="500" x2="1420" y2="500"/>
    <line x1="180" y1="382.5" x2="1420" y2="382.5"/>
    <line x1="180" y1="265" x2="1420" y2="265"/>
    <line x1="304" y1="265" x2="304" y2="735"/>
    <line x1="552" y1="265" x2="552" y2="735"/>
    <line x1="800" y1="265" x2="800" y2="735"/>
    <line x1="1048" y1="265" x2="1048" y2="735"/>
    <line x1="1296" y1="265" x2="1296" y2="735"/>
  </g>

  <g fill="#8290AD" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="19">
    <text x="151" y="742" text-anchor="end">60</text>
    <text x="151" y="624.5" text-anchor="end">70</text>
    <text x="151" y="507" text-anchor="end">80</text>
    <text x="151" y="389.5" text-anchor="end">90</text>
    <text x="151" y="272" text-anchor="end">100</text>
    <text x="304" y="773" text-anchor="middle">60</text>
    <text x="552" y="773" text-anchor="middle">80</text>
    <text x="800" y="773" text-anchor="middle">100</text>
    <text x="1048" y="773" text-anchor="middle">120</text>
    <text x="1296" y="773" text-anchor="middle">140</text>
  </g>
  <text x="800" y="822" fill="#AAB7D3" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" text-anchor="middle">Focused work (minutes) · lower is faster →</text>
  <text x="55" y="500" fill="#AAB7D3" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" text-anchor="middle" transform="rotate(-90 55 500)">Official quality score / 100</text>

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <circle cx="1296" cy="345.7" r="42" fill="url(#fable)" filter="url(#shadow)"/>
    <text x="1235" y="328" fill="#F9D77F" font-size="27" font-weight="800" text-anchor="end">Fable · 93.13</text>
    <text x="1235" y="357" fill="#98A7C3" font-size="19" text-anchor="end">140 min · 111 tests</text>

    <circle cx="1184.7" cy="448.5" r="29" fill="url(#sol)" filter="url(#shadow)"/>
    <text x="1138" y="440" fill="#7FDFFF" font-size="27" font-weight="800" text-anchor="end">Sol · 84.38</text>
    <text x="1138" y="469" fill="#98A7C3" font-size="19" text-anchor="end">131.02 min · 52 tests</text>

    <line x1="334.6" y1="624.5" x2="334.6" y2="434.8" stroke="#FF8277" stroke-width="4" stroke-dasharray="12 9" marker-end="url(#arrow)"/>
    <circle cx="334.6" cy="639.5" r="24" fill="url(#grok)" filter="url(#shadow)"/>
    <text x="380" y="638" fill="#FF9A91" font-size="27" font-weight="800">Grok · 68.13</text>
    <text x="380" y="667" fill="#98A7C3" font-size="19">62.47 min · 36 tests · official</text>

    <circle cx="334.6" cy="433.8" r="30" fill="#FF766A" fill-opacity="0.08" stroke="#FF8277" stroke-width="4" stroke-dasharray="9 7"/>
    <text x="380" y="417" fill="#FF9A91" font-size="25" font-weight="800">85.63 if merged</text>
    <text x="380" y="446" fill="#98A7C3" font-size="19">Same speed. Same 36 tests. Counterfactual only.</text>
  </g>

  <text x="100" y="868" fill="#8290AD" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="19">Focused minutes from benchmark/result.json. Scores from the 21 August half-level quality rescore.</text>
</svg>
