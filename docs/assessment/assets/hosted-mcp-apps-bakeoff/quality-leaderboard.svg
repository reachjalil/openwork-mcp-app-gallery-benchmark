<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Proof beat speed: quality leaderboard</title>
  <desc id="desc">Horizontal bar chart. Fable scored 93.13 and passed. Grok would score 85.63 in a clearly labeled merge counterfactual. Sol scored 84.38 and passed. Grok officially scored 68.13 and remained incomplete.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B16"/>
      <stop offset="1" stop-color="#111A31"/>
    </linearGradient>
    <linearGradient id="fable" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F3B94F"/>
      <stop offset="1" stop-color="#FFE39A"/>
    </linearGradient>
    <linearGradient id="sol" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#238CCB"/>
      <stop offset="1" stop-color="#65D7FF"/>
    </linearGradient>
    <linearGradient id="grok" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C84758"/>
      <stop offset="1" stop-color="#FF7B6F"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1450" cy="30" r="330" fill="#4E67FF" opacity="0.08"/>
  <circle cx="90" cy="870" r="300" fill="#FFB648" opacity="0.06"/>

  <text x="100" y="104" fill="#91A4C9" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="26" font-weight="700" letter-spacing="4">MCP APPS BAKE-OFF · 17 AUG 2026</text>
  <text x="100" y="172" fill="#F6F8FF" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="58" font-weight="800">Proof beat speed.</text>
  <text x="100" y="218" fill="#AAB7D3" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="25">Quality score out of 100. The dashed bar is a counterfactual—not an official verdict.</text>

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <g fill="#657596" font-size="20" text-anchor="middle">
      <text x="390" y="274">0</text>
      <text x="642.5" y="274">25</text>
      <text x="895" y="274">50</text>
      <text x="1147.5" y="274">75</text>
      <text x="1400" y="274">100</text>
    </g>
    <g stroke="#293550" stroke-width="1">
      <line x1="390" y1="292" x2="390" y2="739"/>
      <line x1="642.5" y1="292" x2="642.5" y2="739"/>
      <line x1="895" y1="292" x2="895" y2="739"/>
      <line x1="1147.5" y1="292" x2="1147.5" y2="739"/>
      <line x1="1400" y1="292" x2="1400" y2="739"/>
    </g>

    <g>
      <text x="100" y="355" fill="#F6F8FF" font-size="32" font-weight="800">Fable</text>
      <text x="100" y="386" fill="#F3C96F" font-size="20" font-weight="700">PASSED</text>
      <rect x="390" y="326" width="1010" height="58" rx="18" fill="#172039"/>
      <rect x="390" y="326" width="940.61" height="58" rx="18" fill="url(#fable)" filter="url(#glow)"/>
      <text x="1350.61" y="365" fill="#FCE9B8" font-size="34" font-weight="850">93.13</text>
    </g>

    <g>
      <text x="100" y="470" fill="#F6F8FF" font-size="32" font-weight="800">Grok</text>
      <text x="100" y="501" fill="#FF9A91" font-size="20" font-weight="700">IF MERGED · HYPOTHETICAL</text>
      <rect x="390" y="441" width="1010" height="58" rx="18" fill="#172039"/>
      <rect x="390" y="441" width="864.86" height="58" rx="18" fill="#FF766A" fill-opacity="0.10" stroke="#FF766A" stroke-width="4" stroke-dasharray="14 10"/>
      <text x="1274.86" y="480" fill="#FF9A91" font-size="34" font-weight="850">85.63</text>
    </g>

    <g>
      <text x="100" y="585" fill="#F6F8FF" font-size="32" font-weight="800">Sol</text>
      <text x="100" y="616" fill="#65D7FF" font-size="20" font-weight="700">PASSED</text>
      <rect x="390" y="556" width="1010" height="58" rx="18" fill="#172039"/>
      <rect x="390" y="556" width="852.24" height="58" rx="18" fill="url(#sol)"/>
      <text x="1262.24" y="595" fill="#9AE7FF" font-size="34" font-weight="850">84.38</text>
    </g>

    <g>
      <text x="100" y="700" fill="#F6F8FF" font-size="32" font-weight="800">Grok</text>
      <text x="100" y="731" fill="#FF8A80" font-size="20" font-weight="700">OFFICIAL · INCOMPLETE</text>
      <rect x="390" y="671" width="1010" height="58" rx="18" fill="#172039"/>
      <rect x="390" y="671" width="688.11" height="58" rx="18" fill="url(#grok)"/>
      <text x="1098.11" y="710" fill="#FFAAA2" font-size="34" font-weight="850">68.13</text>
    </g>
  </g>

  <rect x="100" y="792" width="1400" height="2" fill="#293550"/>
  <text x="100" y="840" fill="#8E9BB6" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="21">Quality rescore uses seven weighted categories and half-levels. Official verdicts remain Passed / Passed / Incomplete.</text>
</svg>
