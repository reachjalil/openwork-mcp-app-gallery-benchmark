<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">What a Grok merge would change</title>
  <desc id="desc">A stacked score bar starts at Grok's official 68.13 points. A hypothetical merge adds 10 points for shipped and complete, 1.87 for security, 1.88 for deploy, and 3.75 for speed, reaching 85.63. Protocol, hosts, and maintainability do not change.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090C17"/>
      <stop offset="1" stop-color="#17122A"/>
    </linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C34458"/>
      <stop offset="1" stop-color="#FF756A"/>
    </linearGradient>
    <linearGradient id="gain" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F1B74C"/>
      <stop offset="1" stop-color="#72D8FF"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1460" cy="20" r="330" fill="#FF665E" opacity="0.07"/>

  <text x="100" y="104" fill="#A392C9" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="26" font-weight="700" letter-spacing="4">THE MERGE COUNTERFACTUAL</text>
  <text x="100" y="172" fill="#F8F6FF" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="56" font-weight="800">One merge was worth 17.50 points.</text>
  <text x="100" y="218" fill="#C0B7D6" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="25">Enough for a narrow second. Not enough to beat Fable.</text>

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <g fill="#756A8E" font-size="20" text-anchor="middle">
      <text x="120" y="304">0</text>
      <text x="460" y="304">25</text>
      <text x="800" y="304">50</text>
      <text x="1140" y="304">75</text>
      <text x="1480" y="304">100</text>
    </g>
    <rect x="120" y="330" width="1360" height="100" rx="26" fill="#211A36"/>
    <rect x="120" y="330" width="926.57" height="100" rx="26" fill="url(#base)"/>
    <rect x="1046.57" y="330" width="136" height="100" fill="#F2B94F"/>
    <rect x="1182.57" y="330" width="25.43" height="100" fill="#F8D77B"/>
    <rect x="1208" y="330" width="25.57" height="100" fill="#A6E4F5"/>
    <rect x="1233.57" y="330" width="51" height="100" fill="#55C8F0"/>
    <line x1="1284.57" y1="304" x2="1284.57" y2="458" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="7 8"/>

    <text x="120" y="479" fill="#FF9F96" font-size="22" font-weight="700">OFFICIAL</text>
    <text x="120" y="540" fill="#FFFFFF" font-size="70" font-weight="850">68.13</text>
    <text x="365" y="535" fill="#AD9BBC" font-size="28">Incomplete</text>

    <text x="1284.57" y="479" fill="#77D9F8" font-size="22" font-weight="700" text-anchor="end">IF MERGED</text>
    <text x="1284.57" y="540" fill="#FFFFFF" font-size="70" font-weight="850" text-anchor="end">85.63</text>

    <g>
      <rect x="100" y="626" width="330" height="118" rx="22" fill="#211A36" stroke="#44385B"/>
      <text x="126" y="667" fill="#F2B94F" font-size="21" font-weight="750">SHIPPED + COMPLETE</text>
      <text x="126" y="721" fill="#FFFFFF" font-size="42" font-weight="850">+10.00</text>
    </g>
    <g>
      <rect x="456" y="626" width="330" height="118" rx="22" fill="#211A36" stroke="#44385B"/>
      <text x="482" y="667" fill="#F8D77B" font-size="21" font-weight="750">SECURITY</text>
      <text x="482" y="721" fill="#FFFFFF" font-size="42" font-weight="850">+1.87</text>
    </g>
    <g>
      <rect x="812" y="626" width="330" height="118" rx="22" fill="#211A36" stroke="#44385B"/>
      <text x="838" y="667" fill="#A6E4F5" font-size="21" font-weight="750">DEPLOY</text>
      <text x="838" y="721" fill="#FFFFFF" font-size="42" font-weight="850">+1.88</text>
    </g>
    <g>
      <rect x="1168" y="626" width="330" height="118" rx="22" fill="#211A36" stroke="#44385B"/>
      <text x="1194" y="667" fill="#55C8F0" font-size="21" font-weight="750">SPEED CAP</text>
      <text x="1194" y="721" fill="#FFFFFF" font-size="42" font-weight="850">+3.75</text>
    </g>
  </g>

  <text x="100" y="824" fill="#A99DBC" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22">Unchanged by a merge: protocol, host proof, and maintainability. The official verdict remains Incomplete.</text>
</svg>
