name: Public Readiness

on:
  pull_request:
  push:
    branches: [forward]

permissions:
  contents: read

jobs:
  public-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run generate
      - run: pnpm run verify:notices
      - run: pnpm run scan:source
      - run: pnpm run scan:secrets
      - run: pnpm audit --audit-level=high --prod
      - uses: actions/upload-artifact@v7
        with:
          name: cyclonedx-sbom
          path: generated/sbom.cdx.json
          retention-days: 30
