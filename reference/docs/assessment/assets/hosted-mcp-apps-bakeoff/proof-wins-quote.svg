<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">The fastest builder lost at the merge gate</title>
  <desc id="desc">A share card stating: The fastest builder lost at the merge gate. Fable won on proof. A small footer lists Fable 93.13, Sol 84.38, and Grok 68.13 official or 85.63 if merged.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B16"/>
      <stop offset="0.55" stop-color="#10162A"/>
      <stop offset="1" stop-color="#241526"/>
    </linearGradient>
    <linearGradient id="lineA" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#F1B84F"/><stop offset="1" stop-color="#FFE7A1"/></linearGradient>
    <linearGradient id="lineB" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#2C92CC"/><stop offset="1" stop-color="#68DBFF"/></linearGradient>
    <linearGradient id="lineC" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#D34A5C"/><stop offset="1" stop-color="#FF786D"/></linearGradient>
    <filter id="soft" x="-20%" y="-200%" width="140%" height="500%"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1420" cy="80" r="380" fill="#FF675D" opacity="0.06"/>
  <circle cx="130" cy="820" r="360" fill="#4A78FF" opacity="0.06"/>

  <g opacity="0.32" filter="url(#soft)">
    <path d="M90 220 C390 160, 620 250, 950 170 S1390 170, 1540 110" fill="none" stroke="url(#lineA)" stroke-width="16"/>
    <path d="M90 300 C420 230, 650 350, 960 260 S1360 290, 1540 240" fill="none" stroke="url(#lineB)" stroke-width="14"/>
    <path d="M90 380 C420 310, 620 430, 1060 360" fill="none" stroke="url(#lineC)" stroke-width="14"/>
  </g>
  <g opacity="0.85">
    <path d="M90 220 C390 160, 620 250, 950 170 S1390 170, 1540 110" fill="none" stroke="url(#lineA)" stroke-width="4"/>
    <path d="M90 300 C420 230, 650 350, 960 260 S1360 290, 1540 240" fill="none" stroke="url(#lineB)" stroke-width="4"/>
    <path d="M90 380 C420 310, 620 430, 1060 360" fill="none" stroke="url(#lineC)" stroke-width="4"/>
    <rect x="1060" y="323" width="18" height="86" rx="9" fill="#FF786D"/>
    <rect x="1093" y="323" width="18" height="86" rx="9" fill="#FF786D"/>
    <path d="M1078 346 L1093 346 M1078 366 L1093 366 M1078 386 L1093 386" stroke="#FF786D" stroke-width="4"/>
  </g>

  <text x="110" y="506" fill="#94A5C7" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="25" font-weight="750" letter-spacing="4">SAME BRIEF. SAME DAY. DIFFERENT FINISH.</text>
  <text x="110" y="592" fill="#FFFFFF" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="68" font-weight="850">The fastest builder lost</text>
  <text x="110" y="672" fill="#FFFFFF" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="68" font-weight="850">at the merge gate.</text>
  <text x="110" y="746" fill="#FFD77E" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="47" font-weight="780">Fable won on proof.</text>

  <line x1="110" y1="804" x2="1490" y2="804" stroke="#36415C"/>
  <text x="110" y="851" fill="#EBC56F" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="750">FABLE 93.13</text>
  <text x="375" y="851" fill="#69D9FF" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="750">SOL 84.38</text>
  <text x="615" y="851" fill="#FF8A80" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="750">GROK 68.13 OFFICIAL · 85.63 IF MERGED</text>
</svg>
