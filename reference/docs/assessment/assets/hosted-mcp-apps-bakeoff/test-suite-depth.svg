<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Fable built the thickest test suite</title>
  <desc id="desc">Stacked horizontal bars compare automated and browser tests. Fable had 96 automated plus 15 browser tests, 111 total. Sol had 42 plus 10, 52 total. Grok had 34 plus 2, 36 total.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080B16"/>
      <stop offset="1" stop-color="#17142A"/>
    </linearGradient>
    <linearGradient id="auto" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3B62E8"/>
      <stop offset="1" stop-color="#688CFF"/>
    </linearGradient>
    <linearGradient id="browser" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E8A932"/>
      <stop offset="1" stop-color="#FFD979"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="80" cy="860" r="340" fill="#4C66FF" opacity="0.06"/>
  <text x="100" y="105" fill="#A493C8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="26" font-weight="700" letter-spacing="4">MAINTAINABILITY · FINAL SUITE</text>
  <text x="100" y="174" fill="#F8F7FF" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="56" font-weight="800">Fable built a much thicker safety net.</text>
  <text x="100" y="219" fill="#B3AAC7" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24">Automated and browser tests recorded at the end of the 17 August benchmark.</text>

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <g transform="translate(100 260)">
      <rect width="18" height="18" rx="4" fill="url(#auto)"/>
      <text x="30" y="17" fill="#B9B1CD" font-size="20">Automated</text>
      <rect x="170" width="18" height="18" rx="4" fill="url(#browser)"/>
      <text x="200" y="17" fill="#B9B1CD" font-size="20">Browser</text>
    </g>

    <g fill="#736A88" font-size="18" text-anchor="middle">
      <text x="410" y="313">0</text>
      <text x="635" y="313">30</text>
      <text x="860" y="313">60</text>
      <text x="1085" y="313">90</text>
      <text x="1310" y="313">120</text>
    </g>
    <g stroke="#302A43" stroke-width="1">
      <line x1="410" y1="330" x2="410" y2="748"/>
      <line x1="635" y1="330" x2="635" y2="748"/>
      <line x1="860" y1="330" x2="860" y2="748"/>
      <line x1="1085" y1="330" x2="1085" y2="748"/>
      <line x1="1310" y1="330" x2="1310" y2="748"/>
    </g>

    <g>
      <text x="100" y="397" fill="#FFFFFF" font-size="35" font-weight="800">Fable</text>
      <text x="100" y="431" fill="#A79EBB" font-size="20">96 automated + 15 browser</text>
      <rect x="410" y="359" width="900" height="70" rx="20" fill="#211B35"/>
      <path d="M430 359 H1130 V429 H430 Q410 429 410 409 V379 Q410 359 430 359Z" fill="url(#auto)"/>
      <path d="M1130 359 H1222.5 Q1242.5 359 1242.5 379 V409 Q1242.5 429 1222.5 429 H1130Z" fill="url(#browser)"/>
      <text x="1265" y="405" fill="#FFE092" font-size="35" font-weight="850">111</text>
    </g>

    <g>
      <text x="100" y="557" fill="#FFFFFF" font-size="35" font-weight="800">Sol</text>
      <text x="100" y="591" fill="#A79EBB" font-size="20">42 automated + 10 browser</text>
      <rect x="410" y="519" width="900" height="70" rx="20" fill="#211B35"/>
      <path d="M430 519 H725 V589 H430 Q410 589 410 569 V539 Q410 519 430 519Z" fill="url(#auto)"/>
      <path d="M725 519 H780 Q800 519 800 539 V569 Q800 589 780 589 H725Z" fill="url(#browser)"/>
      <text x="823" y="565" fill="#FFFFFF" font-size="35" font-weight="850">52</text>
    </g>

    <g>
      <text x="100" y="717" fill="#FFFFFF" font-size="35" font-weight="800">Grok</text>
      <text x="100" y="751" fill="#A79EBB" font-size="20">34 automated + 2 browser</text>
      <rect x="410" y="679" width="900" height="70" rx="20" fill="#211B35"/>
      <path d="M430 679 H665 V749 H430 Q410 749 410 729 V699 Q410 679 430 679Z" fill="url(#auto)"/>
      <path d="M665 679 H665 Q680 679 680 694 V734 Q680 749 665 749Z" fill="url(#browser)"/>
      <text x="710" y="725" fill="#FFFFFF" font-size="35" font-weight="850">36</text>
    </g>
  </g>

  <line x1="100" y1="798" x2="1500" y2="798" stroke="#39304C"/>
  <text x="100" y="844" fill="#A79EBB" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="21">A merge would not add tests: Grok-if-merged remains 34 automated + 2 browser.</text>
</svg>
