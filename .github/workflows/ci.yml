name: CI

on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  candidate:
    name: ${{ matrix.candidate }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        candidate: [gallery, sol, fable, grok]
    defaults:
      run:
        working-directory: implementations/${{ matrix.candidate }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: implementations/${{ matrix.candidate }}/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run ci:check

  comparison:
    name: comparison
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/benchmark/validate-results.mjs
      - run: node scripts/benchmark/build-comparison.mjs
      - run: node scripts/benchmark/build-scorecard.mjs
      - run: node scripts/benchmark/verify-source-manifest.mjs
      - name: Fail when generated files drift
        run: git diff --exit-code -- benchmark/combined-result.json docs/assessment/scorecard.md
